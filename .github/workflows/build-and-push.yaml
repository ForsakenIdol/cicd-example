name: build-and-push
on:
  push:
    paths:
      - "html/**"
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - name: Make repository contents available on the runner
        uses: actions/checkout@v4

      - name: Trivy Scan 1 - File System
        uses: aquasecurity/trivy-action@0.33.1
        with:
            scan-type: fs
            scan-ref: '.'
            format: 'table'
            exit-code: '0' # Never fail the pipeline, regardless of what Trivy finds
            severity: 'HIGH,CRITICAL'

      - name: Build the image
        run: docker build -t forsakenidol/cicd-practice-httpd:latest .

      - name: Trivy Scan 2 - Container Image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: forsakenidol/cicd-practice-httpd:latest
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      - name: Authenticate to Docker
        env:
          TOKEN: ${{ secrets.docker_token }}
        run: docker login -u forsakenidol -p $TOKEN
      
      - name: Push the image
        run: docker push forsakenidol/cicd-practice-httpd:latest

      - name: Logout from Docker for safety
        run: docker logout
